name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Python regression tests, including interrupted jobs and workspace recovery
        run: python -m unittest discover -s tests -v
      - name: Frontend workspace and mailbox regression tests
        run: node --test tests/test_*.js
      - name: Validate Python and JavaScript syntax
        run: |
          python -m compileall -q -x '/(node_modules|\.git)/' .
          git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n 1 node --check

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Validate Compose with disposable CI configuration
        env:
          MAIL_PICKUP_ADMIN_TOKEN: ci-compose-validation-only
        run: |
          touch .env
          docker compose config --quiet
      - name: Build container
        run: docker build --tag gpt-account-manager:ci .
      - name: Verify container startup, rejected credentials and restart recovery
        run: bash scripts/ci-container-smoke.sh gpt-account-manager:ci
